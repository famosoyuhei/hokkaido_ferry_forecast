name: LINE Morning Notification

on:
  schedule:
    # Send LINE morning notifications daily at 21:30 UTC (06:30 JST)
    - cron: '30 21 * * *'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  send-line-notifications:
    runs-on: ubuntu-latest
    name: Send LINE Morning Notifications

    steps:
      - name: Trigger LINE morning notifications (with retry)
        run: |
          echo "Triggering LINE morning notifications..."
          MAX_RETRIES=3
          RETRY_DELAY=30
          for i in $(seq 1 $MAX_RETRIES); do
            response=$(curl -s -w "\n%{http_code}" --max-time 60 \
              -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
              "https://web-production-a628.up.railway.app/admin/send-line-test")
            http_code=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | head -n -1)
            echo "Attempt $i/$MAX_RETRIES - HTTP Status: $http_code"
            if [ "$http_code" = "200" ]; then
              echo "LINE morning notifications triggered successfully"
              echo "$body"
              exit 0
            fi
            echo "Failed (status $http_code). Retrying in ${RETRY_DELAY}s..."
            echo "$body"
            sleep $RETRY_DELAY
          done
          echo "LINE morning notification trigger failed after $MAX_RETRIES attempts"
          exit 1
