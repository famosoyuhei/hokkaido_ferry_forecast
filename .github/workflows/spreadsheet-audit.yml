name: Spreadsheet Audit

on:
  schedule:
    # Run at 00:25 UTC (09:25 JST), right after the Accuracy Fill Audit.
    - cron: '25 0 * * *'
  workflow_dispatch:

jobs:
  audit-spreadsheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Export accuracy payload from permanent DB
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" --max-time 180 \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            "https://web-production-a628.up.railway.app/admin/export-accuracy-data?days=14")
          http_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | head -n -1)
          echo "HTTP $http_code"
          test "$http_code" = "200"
          echo "$body" | python -m json.tool > accuracy-export.json

      - name: Run 12-rule spreadsheet audit (DB export + Google Sheets)
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          GOOGLE_SHEETS_BEARER_TOKEN: ${{ secrets.GOOGLE_SHEETS_BEARER_TOKEN }}
        run: python spreadsheet_auditor.py --input accuracy-export.json --output spreadsheet-audit.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spreadsheet-audit
          path: |
            accuracy-export.json
            spreadsheet-audit.json
